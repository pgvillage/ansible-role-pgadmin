---
_pgadmin_platform: >-
  {{ _pgadmin_platforms.get(ansible_facts.distribution,
       _pgadmin_platforms.get(ansible_facts.os_family, {})) }}
_pgadmin_platforms:
  RedHat:
    packages: [pgadmin4-web, httpd, acl]
    rpm_extract_packages: [rpm, cpio]
    selinux_packages: [policycoreutils-python-utils, python3-libselinux, python3-libsemanage]
    user: apache
    group: apache
    service: httpd
    config_file: /etc/httpd/conf.d/pgadmin4.conf
    control: /usr/sbin/apachectl
  Ubuntu:
    packages: [pgadmin4-web, apache2, acl]
    rpm_extract_packages: [rpm2cpio, cpio]
    selinux_packages: [policycoreutils-python-utils, python3-selinux, python3-semanage]
    user: www-data
    group: www-data
    service: apache2
    config_file: /etc/apache2/conf-available/pgadmin4.conf
    control: /usr/sbin/apache2ctl
  Suse:
    packages: [apache2, acl]
    rpm_extract_packages: [rpm, cpio]
    selinux_packages: [policycoreutils-python-utils, python3-selinux, python3-semanage]
    user: wwwrun
    group: www
    service: apache2
    config_file: /etc/apache2/vhosts.d/pgadmin4.conf
    control: /usr/sbin/start_apache2

# The 9.19 Python wheel omits the production frontend. The signed upstream RPM
# contains it; these hashes pin the packages checked together for this repair.
_pgadmin_frontend_repair_artifacts:
  '9.19':
    wheel_url: https://ftp.postgresql.org/pub/pgadmin/pgadmin4/v9.19/pip/pgadmin4-9.19-py3-none-any.whl
    wheel_sha256: 8f7a9966a3bc59144d34900c6ec2a9ba71d6d5ac54fe849747f5dafa6df89462
    rpm_url: https://ftp.postgresql.org/pub/pgadmin/pgadmin4/yum/redhat/rhel-9-x86_64/pgadmin4-server-9.19-1.el9.x86_64.rpm
    rpm_sha256: cb7bb796b7570940f682b3ac5df9c70ef1a0de41026a46777b2bdbf616e21d9b
_pgadmin_required_frontend_assets:
  - style.css
  - vendor.react.js
  - vendor.main.js
  - vendor.others.js
  - vendor.sqleditor.js
  - pgadmin_commons.js
  - security.pages.js

_pgadmin_python: >-
  {{ pgadmin_virtualenv ~ '/bin/python' if pgadmin_install_method == 'pip'
     else pgadmin_package_python }}
_pgadmin_application_dir: >-
  {{ pgadmin_pip_application.stdout if pgadmin_install_method == 'pip'
     else pgadmin_package_application_dir }}
_pgadmin_apache_configtest: >-
  {{ [pgadmin_apache_control, '-t']
     + (['-D', 'SSL'] if ansible_facts.os_family == 'Suse' and pgadmin_tls_enabled | bool else []) }}
_pgadmin_managed_settings:
  - SERVER_MODE
  - DATA_DIR
  - LOG_FILE
  - SQLITE_PATH
  - SESSION_DB_PATH
  - STORAGE_DIR
  - KERBEROS_CCACHE_DIR
  - AZURE_CREDENTIAL_CACHE_DIR
  - APPLICATION_ROOT
  - SESSION_COOKIE_PATH
  - SESSION_COOKIE_SECURE
  - REMEMBER_COOKIE_SECURE
  - PROXY_X_FOR_COUNT
  - PROXY_X_PROTO_COUNT
  - PROXY_X_HOST_COUNT
  - PROXY_X_PORT_COUNT
  - PROXY_X_PREFIX_COUNT
