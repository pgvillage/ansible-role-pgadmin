---

- name: Configure the pgAdmin firewall
  when: pgadmin_enable_firewall | bool
  block:
    - name: Install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Allow HTTP access to pgAdmin
      ansible.posix.firewalld:
        service: http
        permanent: true
        immediate: true
        state: enabled
