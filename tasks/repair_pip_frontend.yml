---
- name: Require verified frontend artifacts for this pgAdmin version
  ansible.builtin.assert:
    that: pgadmin_pip_version in _pgadmin_frontend_repair_artifacts
    fail_msg: >-
      The pgAdmin {{ pgadmin_pip_version }} Python wheel is missing frontend bundles.
      No verified same-version repair is available. Install a complete wheel for
      this version; do not downgrade an existing configuration database.
    quiet: true

- name: Install tools for extracting the official frontend bundles
  ansible.builtin.package:
    name: "{{ _pgadmin_platform.rpm_extract_packages }}"
    state: present
  when: _pgadmin_platform.rpm_extract_packages | length > 0

- name: Create a temporary frontend repair directory
  ansible.builtin.tempfile:
    state: directory
    suffix: pgadmin-frontend
  register: pgadmin_frontend_tmp

- name: Recover the frontend from verified same-version packages
  vars:
    _pgadmin_frontend_artifact: "{{ _pgadmin_frontend_repair_artifacts[pgadmin_pip_version] }}"
    _pgadmin_frontend_wheel: "pgadmin4-{{ pgadmin_pip_version }}-py3-none-any.whl"
    _pgadmin_repaired_wheel: "pgadmin4-{{ pgadmin_pip_version }}-1-py3-none-any.whl"
  block:
    - name: Download the verified pgAdmin Python wheel
      ansible.builtin.get_url:
        url: "{{ _pgadmin_frontend_artifact.wheel_url }}"
        checksum: "sha256:{{ _pgadmin_frontend_artifact.wheel_sha256 }}"
        dest: "{{ pgadmin_frontend_tmp.path }}/{{ _pgadmin_frontend_wheel }}"
        mode: '0600'
        timeout: 60

    - name: Download the verified pgAdmin frontend donor package
      ansible.builtin.get_url:
        url: "{{ _pgadmin_frontend_artifact.rpm_url }}"
        checksum: "sha256:{{ _pgadmin_frontend_artifact.rpm_sha256 }}"
        dest: "{{ pgadmin_frontend_tmp.path }}/frontend.rpm"
        mode: '0600'
        timeout: 60

    # Only extract static assets and two files used to verify that the builds match.
    # No RPM is installed and none of its Python code or native libraries is used.
    - name: Extract the frontend bundles and matching build information
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail;
          rpm2cpio frontend.rpm | cpio -idm --quiet --no-absolute-filenames
          './usr/pgadmin4/web/pgadmin/static/js/generated/*'
          './usr/pgadmin4/web/pgadmin/templates/base.html'
          './usr/pgadmin4/web/version.py'
        chdir: "{{ pgadmin_frontend_tmp.path }}"
        executable: /bin/bash
      changed_when: true

    - name: Build a complete wheel without changing application code
      ansible.builtin.command:
        argv: >-
          {{ [pgadmin_virtualenv ~ '/bin/python', '-',
              pgadmin_frontend_tmp.path ~ '/' ~ _pgadmin_frontend_wheel,
              pgadmin_frontend_tmp.path ~ '/usr/pgadmin4/web',
              pgadmin_frontend_tmp.path ~ '/' ~ _pgadmin_repaired_wheel]
             + _pgadmin_required_frontend_assets }}
        stdin: "{{ lookup('ansible.builtin.file', 'repair_frontend_wheel.py') }}"
      changed_when: true

    - name: Install the repaired pgAdmin wheel
      ansible.builtin.pip:
        name: "{{ pgadmin_frontend_tmp.path }}/{{ _pgadmin_repaired_wheel }}"
        executable: "{{ pgadmin_virtualenv }}/bin/pip"
        state: forcereinstall
        extra_args: --no-deps --no-index
      register: pgadmin_frontend_repair_result
      notify: Restart pgAdmin application
  always:
    - name: Remove temporary frontend repair packages
      ansible.builtin.file:
        path: "{{ pgadmin_frontend_tmp.path }}"
        state: absent
